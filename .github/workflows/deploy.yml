name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: visioniqreg.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        cd backend
        docker build -t visioniqreg.azurecr.io/visioniq-backend:${{ github.sha }} .
        docker build -t visioniqreg.azurecr.io/visioniq-backend:latest .
        docker push visioniqreg.azurecr.io/visioniq-backend:${{ github.sha }}
        docker push visioniqreg.azurecr.io/visioniq-backend:latest

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'visioniq-backend'
        images: 'visioniqreg.azurecr.io/visioniq-backend:latest'
